# ExaBGP 4.x örnek yapılandırması
#
# ddosd, mitigation.driver: exabgp ile API komutlarını
# /var/run/ddosd/exabgp.cmd dosyasına satır satır ekler. Aşağıdaki process
# bu dosyayı takip eder ve her satırı ExaBGP'ye komut olarak verir.
#
# Router tarafında bu oturum yalnızca FlowSpec (ve RTBH için unicast)
# KABUL etmeli; ExaBGP'den asla tam tablo veya default route kabul etmeyin.
# Router'da import policy ile prefix uzunluğu ve community kontrolü yapın.

process ddosd {
    run /usr/bin/tail -n0 -F /var/run/ddosd/exabgp.cmd;
    encoder text;
}

neighbor 192.0.2.1 {                 # router (route reflector önerilir)
    router-id 192.0.2.10;
    local-address 192.0.2.10;        # ddosd/exabgp sunucusu
    local-as 65010;
    peer-as 65000;
    hold-time 180;
    group-updates false;

    family {
        ipv4 flow;
        ipv6 flow;
        ipv4 unicast;                # RTBH için
        ipv6 unicast;
    }

    api {
        processes [ ddosd ];
    }
}
